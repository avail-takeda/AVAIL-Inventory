<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="棚卸BCリーダー">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="stylesheet" href="style.css?v=1.6.0">
<title>棚卸BCリーダー</title>
</head>
<body>
<header>
  <div class="headerSide headerLeft">
    <div class="logoButton" aria-label="AVAIL">
      <img id="headerLogo" src="avail-logo.png" alt="AVAIL">
    </div>
  </div>
  <div class="headerTitle" id="headerTitle">棚卸BCリーダー</div>
  <div class="headerSide headerRight">
    
  </div>
</header>
<main>
<section class="card">
<h2>入力</h2>

<div class="staffrow">
  <div class="stafffield">
    <label for="staff1">担当1</label>
    <input id="staff1" type="text" lang="ja" inputmode="text" autocomplete="name"
      maxlength="3" placeholder="担当者名" enterkeyhint="next">
  </div>
  <div class="stafffield">
    <label for="staff2">担当2</label>
    <input id="staff2" type="text" lang="ja" inputmode="text" autocomplete="name"
      maxlength="3" placeholder="担当者名" enterkeyhint="next">
  </div>
</div>

<div class="shelfLabels">
  <label>棚番号</label>
  <label>枝番号</label>
</div>
<div class="shelfrow">
<select id="shelf" aria-label="棚番号"></select>
<select id="branch" aria-label="枝番号">
<option value="">なし</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
</select>
</div>
<small class="fieldnote">枝番号を選ぶと「A-1-1」の形式で管理します。</small>
<div class="readno-display" aria-live="polite"><span class="readno-label">№</span><span id="readNo">1</span></div>
<label>JANコード</label>
<div class="janrow"><input id="jan" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="JANを入力・スキャン"><button id="camera">カメラ</button></div>
<label>数量</label><input id="qty" type="number" inputmode="numeric" min="0" step="1" placeholder="数量">
<div class="actions"><button id="register" class="primary">登録</button><button id="cancel" class="secondary hidden">キャンセル</button></div>
</section>
<section class="card">
<div class="listhead"><div><h2>入力済みデータ</h2><small id="count">0件</small></div><div class="data-actions"><button id="csv" class="export">CSV出力</button><button id="clearAll" class="bulk-delete">一括削除</button></div></div>
<div id="list"><div class="empty">まだデータがありません</div></div>
</section>
<section class="history-card">
<div class="history-head"><div><h2>CSV出力済みデータ</h2><div id="historyCount" class="history-count">0件</div></div><button id="clearHistory" class="history-clear">一覧を一括削除</button></div>
<div id="csvHistory" class="csv-history"><div class="empty">CSV出力済みファイルはありません</div></div>
</section>
</main>

<div id="modal" class="modal hidden">
<div class="cameraPanel">
<div class="cameraHead"><b>JAN読み取り</b><button id="close">閉じる</button></div>
<div class="videoWrap"><video id="video" playsinline muted></video><div class="frame"></div><div class="guide">バーコードを枠内に合わせてください</div></div>
<div id="status">カメラを起動しています…</div>
<button id="photo" class="secondary wide">写真から読み取る</button>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
</div>
</div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<script src="config.js?v=1.6.0"></script>
<script src="app.js?v=1.6.0"></script>

</body>
</html>
