<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="棚卸リーダー">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="stylesheet" href="style.css">
<title>棚卸リーダー</title>
</head>
<body>
<header>
  <div class="headerSide headerLeft">
    <button id="logoButton" class="logoButton" type="button" aria-label="ロゴ設定">
      <img id="headerLogo" alt="AVAIL" hidden>
      <span id="logoPlaceholder">AVAIL</span>
    </button>
  </div>
  <div class="headerTitle" id="appTitle">棚卸リーダー</div>
  <div class="headerSide headerRight">
    <button id="settingsButton" class="settingsButton" type="button" aria-label="設定">⚙</button>
    <button id="clearAll">全削除</button>
  </div>
</header>
<main>
<section class="card">
<h2>入力</h2>
<div class="shelfLabels">
  <label>棚番号</label>
  <label>枝番号</label>
</div>
<div class="shelfrow">
<select id="shelf" aria-label="棚番号"></select>
<select id="branch" aria-label="枝番号">
<option value="">なし</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
</select>
</div>
<small class="fieldnote">枝番号を選ぶと「A-01-1」の形式で管理します。</small>
<label>JANコード</label>
<div class="janrow"><input id="jan" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="JANを入力・スキャン"><button id="camera">カメラ</button></div>
<label>数量</label><input id="qty" type="number" inputmode="numeric" min="0" step="1" placeholder="数量">
<div class="actions"><button id="register" class="primary">登録</button><button id="cancel" class="secondary hidden">キャンセル</button></div>
</section>
<section class="card">
<div class="listhead"><div><h2>入力済みデータ</h2><small id="count">0件</small></div><button id="csv" class="export">CSV出力</button></div>
<div id="list"><div class="empty">まだデータがありません</div></div>
</section>
</main>

<div id="settingsModal" class="settingsModal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="settingsPanel">
    <div class="settingsHead">
      <h2 id="settingsTitle">設定</h2>
      <button id="closeSettings" type="button" aria-label="設定を閉じる">閉じる</button>
    </div>
    <div class="settingsBody">
      <label for="titleInput">アプリタイトル</label>
      <p class="settingsNote">ここで入力した文字列が、ヘッダー中央に表示されます。</p>
      <input id="titleInput" class="settingsText" type="text" maxlength="30" placeholder="棚卸リーダー" autocomplete="off">
      <div class="settingsActions titleActions">
        <button id="saveTitle" class="secondary" type="button">タイトルを保存</button>
      </div>

      <label for="logoInput">ヘッダーのロゴ</label>
      <p class="settingsNote">ロゴ画像をこの端末に保存します。画像はサーバーへアップロードされず、棚卸アプリ内にのみ保存されます。</p>
      <div class="logoPreviewWrap">
        <div class="logoPreviewBox">
          <img id="logoPreview" alt="ロゴプレビュー" hidden>
          <span id="logoPreviewEmpty">ロゴ未設定</span>
        </div>
      </div>
      <div class="settingsActions">
        <button id="uploadLogo" class="secondary" type="button">ロゴを選択</button>
        <button id="removeLogo" class="secondary" type="button">ロゴを削除</button>
      </div>
      <input id="logoInput" type="file" accept="image/*" hidden>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
<div class="cameraPanel">
<div class="cameraHead"><b>JAN読み取り</b><button id="close">閉じる</button></div>
<div class="videoWrap"><video id="video" playsinline muted></video><div class="frame"></div><div class="guide">バーコードを枠内に合わせてください</div></div>
<div id="status">カメラを起動しています…</div>
<button id="photo" class="secondary wide">写真から読み取る</button>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
</div>
</div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
